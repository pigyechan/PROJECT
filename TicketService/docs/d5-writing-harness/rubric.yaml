# rubric.yaml · 글쓰기 하네스 v1 (Blog_Writer config/rubric.yaml 을 에세이 도메인으로 확장)
version: 1
axes:
  - name: message_clarity
    weight: 0.30
    scale:
      1: "핵심 주장이 뭔지 끝까지 읽어도 파악 안 됨"
      2: "핵심 주장은 있으나 여러 문장에 흩어져 있어 한 문장으로 요약 불가"
      3: "핵심 주장이 한 군데 명시되나 뒷받침 논리와 뒤섞여 있음"
      4: "핵심 주장이 명확히 한 문장으로 존재하나 글 후반부에 다시 흐려짐"
      5: "핵심 주장이 도입부에 명확히 제시되고 글 전체가 그 주장 하나로 수렴함"

  - name: four_step_fidelity
    weight: 0.30
    scale:
      1: "4단계(문제정의/증거·관찰/판단·트레이드오프/검증) 구분이 전혀 없음"
      2: "4단계 중 최소 하나가 완전히 빠짐"
      3: "4단계 모두 있으나 하나가 다른 단계 내용과 뒤섞임"
      4: "4단계 모두 명확히 구분되나 분량 배분이 불균형함"
      5: "4단계 모두 명확히 구분되고 각 단계가 독립적으로 읽힘"

  - name: no_fluff
    weight: 0.20
    scale:
      1: "같은 말이 반복되거나 불필요한 수식어가 문단마다 등장"
      2: "여러 군데에서 반복·군더더기 표현이 눈에 띔"
      3: "한두 문장에서 불필요한 반복이나 상투적 표현이 있음"
      4: "거의 없으나 한 곳에서 다듬을 여지가 있음"
      5: "모든 문장이 정보량을 갖고 있고 반복·상투구가 없음"

  - name: reader_alignment
    weight: 0.20
    scale:
      1: "독자가 왜 이 글을 읽어야 하는지 전혀 제시되지 않음"
      2: "독자와의 연결점이 암시되나 명확하지 않음"
      3: "독자와의 연결점이 한 군데 언급되나 형식적임"
      4: "독자의 구체적 상황과 연결되나 도입부에서만 등장하고 이후 사라짐"
      5: "독자의 구체적 상황·문제가 도입부터 결론까지 일관되게 연결됨"

min_total: 3.0
notes: |
  - min_total 미만이면 REJECT(재작성 필요)로 판정한다.
  - 평가자 프롬프트에는 Blog_Writer와 동일하게 "5점은 드뭅니다. 평균 3.0 기준" 문구를 필수 포함한다.
  - Test_Writer(1-1)의 "관대한 그린" 사건(Eval 5.0 만점 vs Critique의 실제 지적 3개가 모순됐던 사건) 재발 방지를 위해,
    Eval은 Critique의 결과를 미리 보지 않고 독립적으로 채점한다(Gen/Critique/Eval 상호 격리).
  - 저자 영역(메시지·논리 자체를 무엇으로 바꿀지)은 AI 산출물에 포함하지 않는다. Critique/Eval은 "무엇이 약한지"만
    지적하고, "그래서 이렇게 다시 써라"는 문장 단위 재작성 제안을 하지 않는다 — 그건 저자(본인)의 판단 영역이다.
