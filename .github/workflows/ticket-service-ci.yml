name: TicketService CI

on:
  push:
    branches: [master]
    paths:
      - 'TicketService/**'
  pull_request:
    branches: [master]
    paths:
      - 'TicketService/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TicketService

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # 유닛 테스트 + Cucumber 인수테스트(Testcontainers로 실제 Postgres 컨테이너를 띄움)를
      # 같은 `test` 태스크로 함께 실행한다. ubuntu-latest 러너에는 Docker가 기본 설치되어 있어
      # Testcontainers가 별도 설정 없이 바로 동작한다.
      - name: Run tests
        run: gradle test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: TicketService/build/reports/tests/test
