openapi: 3.0.3
info:
  title: ClimbingCrew Records API
  description: 방문 기록(Records) 리소스에 대한 API 계약. E-3 요구사항 명세를 스키마로 옮긴 것.
  version: 0.1.0

servers:
  - url: https://api.climbingcrew.example.com/v1

tags:
  - name: Records
    description: 방문 기록 생성/조회/수정/삭제
  - name: Likes
    description: 방문 기록에 대한 반응(좋아요)

paths:
  /records:
    post:
      tags: [Records]
      summary: 방문 기록 생성
      description: 텍스트/별점은 동기로 즉시 저장되고, 사진·동영상은 비동기로 업로드된다.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 클라이언트가 생성한 UUID. 같은 저장 시도를 재시도할 때는 동일한 키를 재사용해야 한다.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordCreateRequest'
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '409':
          $ref: '#/components/responses/DuplicateRecord'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [Records]
      summary: 방문 기록 목록 조회
      description: 기본적으로 본인이 볼 수 있는 기록(본인 기록 + 같은 크루원의 CREW_ONLY 기록)을 반환한다.
      parameters:
        - name: crewId
          in: query
          required: false
          schema:
            type: string
        - name: gymName
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Record'
                  page:
                    type: integer
                  size:
                    type: integer
                  totalCount:
                    type: integer
        '401':
          $ref: '#/components/responses/AuthRequired'

  /records/{recordId}:
    parameters:
      - name: recordId
        in: path
        required: true
        schema:
          type: string

    get:
      tags: [Records]
      summary: 방문 기록 단건 조회
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'
        '403':
          $ref: '#/components/responses/CrewAccessDenied'
        '404':
          $ref: '#/components/responses/RecordNotFound'

    patch:
      tags: [Records]
      summary: 방문 기록 수정 (본인만 가능)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordUpdateRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/CrewAccessDenied'
        '404':
          $ref: '#/components/responses/RecordNotFound'

    delete:
      tags: [Records]
      summary: 방문 기록 삭제 (본인만 가능)
      responses:
        '204':
          description: 삭제 성공 (본문 없음)
        '403':
          $ref: '#/components/responses/CrewAccessDenied'
        '404':
          $ref: '#/components/responses/RecordNotFound'

  /records/{recordId}/likes:
    parameters:
      - name: recordId
        in: path
        required: true
        schema:
          type: string

    post:
      tags: [Likes]
      summary: 방문 기록에 좋아요 추가
      responses:
        '204':
          description: 좋아요 처리 성공 (이미 눌렀어도 멱등하게 204)
        '403':
          $ref: '#/components/responses/CrewAccessDenied'
        '404':
          $ref: '#/components/responses/RecordNotFound'

    delete:
      tags: [Likes]
      summary: 방문 기록 좋아요 취소
      responses:
        '204':
          description: 좋아요 취소 성공 (안 눌려 있었어도 멱등하게 204)
        '404':
          $ref: '#/components/responses/RecordNotFound'

components:
  schemas:
    RecordCreateRequest:
      type: object
      required:
        - gymName
        - visitDate
      properties:
        gymName:
          type: string
          minLength: 1
          maxLength: 100
        visitDate:
          type: string
          format: date
        rating:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
        review:
          type: string
          maxLength: 30
          nullable: true
        visibility:
          type: string
          enum: [PUBLIC, CREW_ONLY, PRIVATE]
          default: CREW_ONLY

    RecordUpdateRequest:
      type: object
      description: 부분 수정. 보낸 필드만 갱신한다.
      properties:
        gymName:
          type: string
          minLength: 1
          maxLength: 100
        visitDate:
          type: string
          format: date
        rating:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
        review:
          type: string
          maxLength: 30
          nullable: true
        visibility:
          type: string
          enum: [PUBLIC, CREW_ONLY, PRIVATE]

    Record:
      type: object
      properties:
        id:
          type: string
        authorId:
          type: string
        gymName:
          type: string
        visitDate:
          type: string
          format: date
        rating:
          type: integer
          nullable: true
        review:
          type: string
          nullable: true
        visibility:
          type: string
          enum: [PUBLIC, CREW_ONLY, PRIVATE]
        mediaStatus:
          type: string
          description: 사진/동영상 비동기 업로드 상태
          enum: [NONE, UPLOADING, READY, FAILED]
        mediaUrls:
          type: array
          items:
            type: string
            format: uri
        likeCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: "에러 코드 체계표 참고 (예: VALIDATION_ERROR, DUPLICATE_RECORD)"
        message:
          type: string

  responses:
    ValidationError:
      description: 필수 필드 누락 또는 형식 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AuthRequired:
      description: 로그인하지 않았거나 토큰 만료
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CrewAccessDenied:
      description: 크루원이 아니어서 접근 불가
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RecordNotFound:
      description: 존재하지 않거나 삭제된 기록
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DuplicateRecord:
      description: 같은 날 같은 암장으로 이미 기록이 있음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: 서버 내부 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
