# E-5 API Contract 검증 파이프라인 — Eval 루브릭
# CodeQuality_Reviewer/config/rubric.yaml 구조를 그대로 재사용하고,
# 축(axes)만 "API 계약 적합성" 도메인에 맞게 새로 정의함.

axes:
  schema_compliance:
    weight: 0.35
    description: 요청/응답 스키마의 필수·선택 필드, 타입, 기본값이 계약과 일치하는가
    scale:
      1: 필수/선택 구분이 뒤집혀 있거나 타입이 계약과 다름
      3: 대부분 일치하지만 기본값이나 null 처리에 사소한 차이가 있음
      5: 계약의 필드/타입/기본값을 정확히 구현함

  error_handling_completeness:
    weight: 0.30
    description: 계약에 정의된 에러 코드/상태 코드가 실제로 트리거되는가 (구현 지시에서 명시적으로 범위 밖으로 뺀 항목은 감점하지 않음)
    scale:
      1: 계약에 있는 에러 케이스 대부분이 구현 범위 안인데도 처리되지 않음
      3: 범위 안 에러는 처리되지만 일부 누락이 있음
      5: 범위로 지정된 모든 에러 케이스가 정확한 코드/상태로 처리됨

  non_functional_fidelity:
    weight: 0.25
    description: 멱등성 설계 문서, 접근 권한 등 NFR/설계 문서와 실제 동작이 일치하는가
    scale:
      1: 설계 문서의 핵심 보장(예: 멱등 재생)이 실제로 깨짐
      3: 기본 동작은 맞지만 상태 변경(수정/삭제) 이후 같은 보장이 깨지는 경우가 있음
      5: 설계 문서에 적힌 보장이 모든 경로에서 유지됨

  scope_discipline:
    weight: 0.10
    description: 계약에 없는 것을 과도하게 만들거나, 반대로 판단을 흐리지 않고 범위를 명확히 밝혔는가
    scale:
      1: 범위 밖 기능을 임의로 만들었거나, 범위 밖으로 둔 이유를 밝히지 않음
      3: 범위는 지켰지만 근거 설명이 부족함
      5: 범위를 지키고, 계약이 침묵하는 부분에서 내린 선택과 이유를 명시함

min_total: 3.0
